name: Update dashboard (manual backup)

# ─────────────────────────────────────────────────────────────────────────────
#  ★ 이 워크플로는 "수동 버튼"이다. cron 이 일부러 꺼져 있다.
#
#  메인 수집은 맥미니의 launchd 가 평일 18:30 KST 에 수행한다. 여기서 스케줄로
#  같이 돌리면 안 되는 이유는 하나다:
#
#    data/kind_decl_snapshots.json 은 되돌릴 수 없는 누적 원장인데,
#    두 머신이 같은 날 같은 파일을 쓰면 rebase 충돌이 나고,
#    충돌 해소를 잘못하면 그날의 실측값이 영구히 사라진다.
#    → 원장의 writer 는 맥미니 하나로 고정한다.
#
#  맥미니가 며칠 죽어 있어서 그 날짜들이 추정치로 떨어지는 게 확실할 때만
#  Actions 탭에서 "Run workflow" 로 한 번 돌린다.
#  ★ 돌린 뒤에는 맥미니에서 반드시 `git pull --rebase` 를 먼저 하고
#     그다음 run_daily.sh 를 돌려라. 안 그러면 다음 push 때 원장이 충돌한다.
#
#  또 하나: 러너는 미국 IP다. KIND/DART/네이버가 한국 IP 를 전제로 굴러가므로
#  차단·다른 응답이 나올 수 있다. 실패하면 그냥 실패하게 두고(커밋 안 함),
#  성공했더라도 값은 맥미니 결과와 한 번 대조하는 게 안전하다.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch: {}
  # 스케줄을 켜고 싶어지면 아래 두 줄의 주석을 풀되, 위의 단일 writer 원칙을
  # 먼저 다시 읽어라. (0 9 * * 1-5 = 18:00 KST, 맥미니 18:30 보다 앞)
  # schedule:
  #   - cron: "0 9 * * 1-5"

permissions:
  contents: write

concurrency:
  group: buyback-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Build data (KIND + DART + Naver)
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TZ: Asia/Seoul
        run: python scripts/build_data.py

      - name: Render
        env:
          TZ: Asia/Seoul
        run: python scripts/render.py --max-age-days 4

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/.nojekyll \
                  data/buyback.json \
                  data/kind_decl_snapshots.json \
                  data/dart_snapshot.json
          if git diff --staged --quiet; then
            echo "변경 없음 - 커밋 생략"
          else
            git commit -m "data: actions manual backup $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')"
            git pull --rebase --autostash origin main
            git push
          fi
